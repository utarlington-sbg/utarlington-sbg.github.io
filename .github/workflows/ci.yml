name: Verify website

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        base_path: ['/', '/website/']
    env:
      BASE_PATH: ${{ matrix.base_path }}
      SITE_URL: https://utarlington-sbg.github.io
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          DEBUG: pw:webserver
      - uses: actions/upload-artifact@v7.0.2
        if: failure()
        with:
          name: browser-test-results-${{ strategy.job-index }}
          path: test-results/
